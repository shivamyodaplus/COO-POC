# docker-compose.yml — application service.
#
# Always used together with docker-compose.infra.yml so that depends_on
# health checks for milvus and postgres resolve correctly. Use start.sh,
# which merges both files automatically, rather than running this file alone.
#
# Manual full-stack start (CPU):
#   docker compose -f docker-compose.infra.yml -f docker-compose.yml up
#
# Manual full-stack start (GPU):
#   docker compose -f docker-compose.infra.yml -f docker-compose.yml \
#                  -f docker-compose.gpu.yml up

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
      - "8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_NAME=FastAPI App
      - VERSION=0.1.0
      - ENVIRONMENT=production
      - MILVUS_URI=http://milvus:19530
      - POSTGRES_DSN=postgresql://appuser:apppassword@postgres:5432/appdb
      - STORAGE_ADAPTER=postgres
      - HF_HOME=/root/.cache/huggingface
      - LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:/lib/aarch64-linux-gnu
      - QWEN_TEXT_BASE_URL=http://host.docker.internal:${QWEN_TEXT_PORT:-8001}/v1
      - QWEN_VL_BASE_URL=http://host.docker.internal:${QWEN_VL_PORT:-8002}/v1
      # LLM provider: "local" (vLLM) or "bedrock" (AWS Bedrock)
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
      # AWS Bedrock — OpenAI-compatible endpoint credentials
      # Set OPENAI_API_KEY to your Bedrock short-term key and
      # OPENAI_BASE_URL to https://bedrock-mantle.<region>.api.aws/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - BEDROCK_TEXT_MODEL=${BEDROCK_TEXT_MODEL:-qwen.qwen3-32b-v1:0}
      - BEDROCK_VISION_MODEL=${BEDROCK_VISION_MODEL:-anthropic.claude-sonnet-5}
      # BGE-M3 device override — 'cuda' forces GPU even on ARM64 where
      # torch.cuda.is_available() returns False.  Leave empty for auto-detect.
      - BGE_M3_DEVICE=${BGE_M3_DEVICE:-cuda}
      # Expose GPU so BGE-M3 can use it.  PYTORCH_JIT=0 prevents NVRTC JIT
      # failures on sm_12.1 (GB10 Blackwell not yet in cu128 NVRTC).
      - PYTORCH_JIT=0
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.paddleocr:/root/.paddleocr
      - ~/.cache/torch:/root/.cache/torch
      - app_images:/app/images
    depends_on:
      milvus:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  app_images:

