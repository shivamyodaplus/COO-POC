[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    "streamlit>=1.35.0",
    "requests>=2.31.0",
    "pymilvus[model]>=2.5.0",
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "opencv-python-headless>=4.8",
    "pypdfium2>=4.0",
    # lightglue has no PyPI release; installed from GitHub in the Dockerfile:
    #   .venv/bin/pip install git+https://github.com/cvg/LightGlue.git
    "psycopg[binary,pool]>=3.2.0",
    # paddlepaddle and paddleocr have no aarch64 pypi wheel;
    # install manually: pip install paddlepaddle paddleocr
    "nltk>=3.10.0",
    "openai>=1.0",
    "httpx>=0.27",
    # LangGraph / LLM inference stack
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",   # ChatOpenAI pointed at local VLLM server
    "langchain-aws>=0.2.0",       # ChatBedrockConverse for AWS Bedrock provider
]

[tool.uv]
package = false
